# Alembic'in ana konfigürasyon dosyası.
# sqlalchemy.url burada YOK — kasıtlı. Veritabanı adresini alembic.ini'ye
# hardcode etmek yerine, migrations/env.py içinde Settings'ten (.env'den) okuyoruz.

[alembic]
script_location = %(here)s/apps/api/db/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
