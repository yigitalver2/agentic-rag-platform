[project]
name = "agentic-rag-platform"
version = "0.0.0"
description = "Agentic RAG platform — öğrenme projesi (bkz. CLAUDE.md, PHASES.md)"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
]

[tool.uv]
package = false


[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "asyncpg-stubs>=0.31",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle hataları
    "F",     # pyflakes (kullanılmayan import, tanımsız isim, vb.)
    "I",     # isort (import sıralama)
    "UP",    # pyupgrade (eski Python idiomlarını modernize etmeyi önerir)
    "B",     # flake8-bugbear (yaygın "sinsi" hatalar: mutable default arg vb.)
    "ASYNC", # async koddaki yaygın hatalar (blocking call in async def vb.)
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["apps", "packages", "workers", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
